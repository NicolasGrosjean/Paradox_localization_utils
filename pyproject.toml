[tool.black]
line-length = 119

[project]
name = "paradox_localization_utils"
version = "0.1.0"
description = "Utilitaries on Paradox localisation files"
readme = "README.md"
requires-python=">=3.10,<3.14"
license = "MIT"
authors = [
    { name = "GROSJEAN_Nicolas", email = "grosjen@hotmail.fr"}
]
dependencies = [
    "joblib>=1.4.2,<2.0.0",
    "requests>=2.32.4,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "python-levenshtein>=0.26.0,<1.0.0"
]


[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pre-commit>=3.8.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "responses>=0.25.3,<1.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "cx-freeze>=7.2.2,<8.0.0",
    "genbadge[all]>=1.1.1,<2.0.0"
]
